name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            file \
            wget

      - name: vp
        run: npm install -g vite-plus@0.1.22

      - name: install
        run: vp install

      - name: build
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: vp exec tauri build --bundles appimage,deb,rpm

      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          name: Writer ${{ github.ref_name }}
          body: |
            **AppImage** is the portable build. `chmod +x` and run it. Arch, Ubuntu, Fedora, and most other distros.

            **.deb** for Debian and Ubuntu.

            **.rpm** for Fedora, RHEL, and openSUSE.
          files: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
